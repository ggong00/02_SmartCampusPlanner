<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Campus Planner</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1>🎓 Smart Campus Planner</h1>
      <p class="app-subtitle">학과 · 동아리 · 개인 할 일을 한곳에서 관리하세요</p>
      <p class="storage-hint">입력한 내용은 이 브라우저에 자동 저장되어, 새로고침해도 유지돼요.</p>
    </header>

    <section class="todo-form-section">
      <form id="todo-form" class="todo-form">
        <div class="form-row">
          <label for="todo-title">할 일</label>
          <input
            type="text"
            id="todo-title"
            name="title"
            placeholder="예) 데이터베이스 과제 제출하기"
            required
          />
        </div>

        <div class="form-row form-row-inline">
          <div class="form-field">
            <label for="todo-category">카테고리</label>
            <select id="todo-category" name="category">
              <option value="학과">학과</option>
              <option value="동아리">동아리</option>
              <option value="개인">개인</option>
            </select>
          </div>

          <div class="form-field">
            <label for="todo-priority">중요도</label>
            <select id="todo-priority" name="priority">
              <option value="상">상</option>
              <option value="중" selected>중</option>
              <option value="하">하</option>
            </select>
          </div>

          <div class="form-field">
            <label for="todo-start-date">시작일 <span class="label-optional">(선택)</span></label>
            <input type="date" id="todo-start-date" name="startDate" />
          </div>

          <div class="form-field">
            <label for="todo-deadline">마감일</label>
            <input type="date" id="todo-deadline" name="deadline" />
          </div>
        </div>

        <button type="submit" class="btn-add">+ 할 일 추가</button>
      </form>
    </section>

    <section class="view-toggle-section">
      <div class="view-toggle" role="tablist" aria-label="보기 방식 전환">
        <button type="button" class="view-toggle-btn active" data-view="list" role="tab" aria-selected="true">
          📋 목록 보기
        </button>
        <button type="button" class="view-toggle-btn" data-view="calendar" role="tab" aria-selected="false">
          🗓️ 달력 보기
        </button>
      </div>
    </section>

    <section class="progress-section">
      <div class="progress-header">
        <span class="progress-label">전체 완료율</span>
        <span id="progress-text" class="progress-text">0 / 0 완료 (0%)</span>
      </div>
      <div class="progress-bar-track">
        <div id="progress-bar-fill" class="progress-bar-fill" style="width: 0%"></div>
      </div>
    </section>

    <section id="list-view" class="todo-list-section">
      <div class="todo-list-header">
        <h2>할 일 목록</h2>
        <span id="todo-count" class="todo-count">0개</span>
      </div>

      <ul id="todo-list" class="todo-list">
        <!-- 할 일 항목이 여기에 동적으로 추가됩니다 -->
      </ul>

      <p id="empty-message" class="empty-message">
        아직 등록된 할 일이 없어요. 위 양식으로 첫 할 일을 추가해보세요!
      </p>
    </section>

    <section id="calendar-view" class="calendar-section hidden">
      <div class="calendar-header">
        <button type="button" id="calendar-prev-btn" class="calendar-nav-btn" aria-label="이전 달">‹</button>
        <h2 id="calendar-month-label" class="calendar-month-label">-</h2>
        <button type="button" id="calendar-next-btn" class="calendar-nav-btn" aria-label="다음 달">›</button>
      </div>

      <div class="calendar-weekdays">
        <span class="calendar-weekday sunday">일</span>
        <span class="calendar-weekday">월</span>
        <span class="calendar-weekday">화</span>
        <span class="calendar-weekday">수</span>
        <span class="calendar-weekday">목</span>
        <span class="calendar-weekday">금</span>
        <span class="calendar-weekday saturday">토</span>
      </div>

      <div id="calendar-grid" class="calendar-grid">
        <!-- 날짜 칸이 여기에 동적으로 추가됩니다 -->
      </div>

      <p class="calendar-hint">일정을 클릭하면 완료 체크, ×를 누르면 삭제할 수 있어요.</p>

      <div id="calendar-undated" class="calendar-undated hidden">
        <h3>날짜가 없는 할 일</h3>
        <ul id="calendar-undated-list" class="todo-list">
          <!-- 시작일/마감일이 없는 할 일이 여기에 표시됩니다 -->
        </ul>
      </div>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
