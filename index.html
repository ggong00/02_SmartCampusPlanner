<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Campus Planner</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app" class="app">

    <!-- ===== 헤더 ===== -->
    <header class="app-header">
      <div class="header-top">
        <div class="header-title">
          <h1>🎓 Smart Campus Planner</h1>
          <p class="app-subtitle">학과 · 동아리 · 개인 할 일을 한곳에서 관리하세요</p>
        </div>
        <div class="header-utils">
          <button id="settings-btn" class="btn-util" title="설정">⚙️ 설정</button>
          <button id="dark-mode-btn" class="btn-util" title="다크 모드 전환">🌙</button>
          <button id="export-btn" class="btn-util" title="데이터 내보내기">⬇ 내보내기</button>
          <label for="import-input" class="btn-util" title="데이터 가져오기" style="cursor:pointer;">⬆ 가져오기</label>
          <input type="file" id="import-input" accept=".json" class="visually-hidden" />
        </div>
      </div>

      <div class="header-controls">
        <input type="search" id="search-input" class="search-input" placeholder="🔍  할 일 검색..." />
        <div class="filter-group">
          <select id="filter-category">
            <option value="all">전체 카테고리</option>
            <option value="학과">학과</option>
            <option value="동아리">동아리</option>
            <option value="개인">개인</option>
          </select>
          <select id="filter-priority">
            <option value="all">전체 중요도</option>
            <option value="상">상</option>
            <option value="중">중</option>
            <option value="하">하</option>
          </select>
          <select id="filter-status">
            <option value="all">전체 상태</option>
            <option value="미완료">미완료</option>
            <option value="완료">완료</option>
          </select>
          <select id="sort-by">
            <option value="created">등록순</option>
            <option value="deadline">마감일순</option>
            <option value="priority">중요도순</option>
          </select>
        </div>
      </div>
    </header>

    <!-- ===== 탭 전환 (태블릿/모바일 전용) ===== -->
    <div class="mobile-tabs" id="mobile-tabs">
      <button class="mobile-tab-btn active" data-tab="list">📋 목록</button>
      <button class="mobile-tab-btn" data-tab="calendar">🗓️ 달력</button>
    </div>

    <!-- ===== 메인 레이아웃 (달력 좌 / 목록 우) ===== -->
    <main class="main-layout" id="main-layout" data-tab="list">

      <!-- 달력 패널 (좌) -->
      <section class="calendar-panel">
        <div class="calendar-header">
          <button type="button" id="calendar-prev-btn" class="calendar-nav-btn" aria-label="이전 달">‹</button>
          <h2 id="calendar-month-label" class="calendar-month-label">-</h2>
          <button type="button" id="calendar-next-btn" class="calendar-nav-btn" aria-label="다음 달">›</button>
        </div>

        <div class="calendar-weekdays">
          <span class="sunday">일</span>
          <span>월</span><span>화</span><span>수</span><span>목</span><span>금</span>
          <span class="saturday">토</span>
        </div>

        <div id="calendar-grid" class="calendar-grid"></div>

      </section>

      <!-- 목록 패널 (우) -->
      <section class="list-panel">

        <!-- 완료율 + 카테고리별 진행률 -->
        <div class="progress-card">
          <div class="progress-header">
            <span class="progress-label">전체 완료율</span>
            <span id="progress-text" class="progress-text">0 / 0 완료 (0%)</span>
          </div>
          <div class="progress-bar-track">
            <div id="progress-bar-fill" class="progress-bar-fill" style="width: 0%"></div>
          </div>
          <div id="category-stats" class="category-stats"></div>
        </div>

        <!-- 할 일 추가 (접고 펼치기) -->
        <div class="add-section">
          <button type="button" id="toggle-form-btn" class="btn-add-toggle">+ 할 일 추가</button>
          <form id="todo-form" class="todo-form hidden">
            <input type="text" id="todo-title" placeholder="할 일 제목" required />
            <textarea id="todo-memo" placeholder="메모 (선택)" rows="2"></textarea>
            <div class="form-row-inline">
              <select id="todo-category">
                <option value="학과">학과</option>
                <option value="동아리">동아리</option>
                <option value="개인">개인</option>
              </select>
              <select id="todo-priority">
                <option value="상">상</option>
                <option value="중" selected>중</option>
                <option value="하">하</option>
              </select>
            </div>
            <div class="form-row-inline">
              <div class="form-field">
                <label for="todo-start-date">시작일 <span class="label-optional">(선택)</span></label>
                <input type="date" id="todo-start-date" />
              </div>
              <div class="form-field">
                <label for="todo-deadline">마감일</label>
                <input type="date" id="todo-deadline" />
              </div>
            </div>
            <div class="form-actions">
              <button type="submit" class="btn-submit">추가</button>
              <button type="button" id="cancel-form-btn" class="btn-cancel">취소</button>
            </div>
          </form>
        </div>

        <!-- 할 일 목록 -->
        <div class="list-section">
          <div class="list-header">
            <h2>할 일 목록</h2>
            <span id="todo-count" class="todo-count">0개</span>
          </div>
          <ul id="todo-list" class="todo-list"></ul>
          <p id="empty-message" class="empty-message hidden">
            조건에 맞는 할 일이 없어요.
          </p>
        </div>

      </section>
    </main>
  </div>

  <!-- ===== 설정 모달 ===== -->
  <div id="settings-modal" class="modal-backdrop hidden">
    <div class="modal-panel">
      <div class="modal-header">
        <h2>⚙️ 설정</h2>
        <button id="close-settings-btn" class="modal-close">×</button>
      </div>
      <div class="modal-body">

        <section class="settings-section">
          <h3>카테고리</h3>
          <div id="settings-category-list" class="settings-chip-list"></div>
          <div class="settings-add-row">
            <input id="new-category-input" type="text" placeholder="새 카테고리 이름" maxlength="20" />
            <button id="add-category-btn" class="btn-submit">추가</button>
          </div>
        </section>

        <section class="settings-section">
          <h3>중요도</h3>
          <div id="settings-priority-list" class="settings-chip-list"></div>
          <div class="settings-add-row">
            <input id="new-priority-input" type="text" placeholder="새 중요도 이름" maxlength="20" />
            <button id="add-priority-btn" class="btn-submit">추가</button>
          </div>
        </section>

      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
